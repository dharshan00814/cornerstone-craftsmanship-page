<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Hyna Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --accent: #7ef7f7;
            --accent-2: #00D4FF;
            --bg: #000000;
            --surface: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF;
            --muted: #9ca3af;
            --font-display: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            isolation: isolate;
        }

        /* ---------- Animated background ---------- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(88, 101, 242, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(0, 212, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Grid overlay */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 20%, transparent 75%);
            pointer-events: none;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.55;
            animation: orbFloat 14s ease-in-out infinite;
        }
        .orb-1 {
            width: 340px;
            height: 340px;
            background: rgba(126, 247, 247, 0.22);
            top: -80px;
            left: -60px;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(0, 212, 255, 0.18);
            bottom: -80px;
            right: -50px;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(88, 101, 242, 0.2);
            top: 50%;
            right: 12%;
            animation-delay: -9s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* Mouse-follow glow */
        .cursor-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(126, 247, 247, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        /* Glass card */
        .login-card {
            position: relative;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 48px 40px 40px;
            box-shadow:
                0 24px 48px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
            overflow: hidden;
        }

        /* Top accent glow line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
            border-radius: 0 0 4px 4px;
            box-shadow: 0 0 18px rgba(126, 247, 247, 0.6);
            animation: gradientShift 6s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- Logo hero ---------- */
        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-bottom: 36px;
            text-align: center;
        }

        .logo-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glowing ring behind logo */
        .logo-wrap::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(126, 247, 247, 0.35) 0%, rgba(0, 212, 255, 0.15) 40%, transparent 70%);
            filter: blur(6px);
            animation: ringPulse 3.5s ease-in-out infinite;
        }
        .logo-wrap::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1.5px solid rgba(126, 247, 247, 0.35);
            animation: ringSpin 10s linear infinite;
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.12); opacity: 1; }
        }
        @keyframes ringSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-logo img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            animation: logoFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 18px rgba(126, 247, 247, 0.35));
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .login-logo h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.02em;
            color: #ffffff;
        }
        .login-logo h1 span {
            background: linear-gradient(120deg, #7ef7f7, #00D4FF, #7ef7f7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shimmerText 4s linear infinite;
        }
        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        .login-logo p {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            margin-top: -6px;
        }

        /* ---------- Form ---------- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.72);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            transition: color 0.25s ease;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 46px 14px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-wrap input:focus {
            border-color: rgba(126, 247, 247, 0.4);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(126, 247, 247, 0.08);
        }

        .input-wrap:focus-within .icon {
            color: var(--accent);
        }

        /* Password toggle */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .toggle-password:hover {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
        }
        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
        }
        .form-options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .form-options a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        .form-options a:hover {
            opacity: 0.8;
        }

        /* ---------- Login button ---------- */
        .btn-login {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #7ef7f7, #00D4FF);
            color: #0a0a0c;
            border: none;
            border-radius: 14px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            letter-spacing: -0.01em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Shimmer sweep */
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }
        .btn-login:hover::before {
            left: 150%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10, 10, 12, 0.3);
            border-top-color: #0a0a0c;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-login.loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- Divider ---------- */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ---------- Social buttons ---------- */
        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .btn-social {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-social:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn-social svg {
            width: 18px;
            height: 18px;
        }

        /* ---------- Footer ---------- */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted);
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .login-footer a:hover {
            opacity: 0.8;
        }

        /* ---------- Back link ---------- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #ffffff;
        }
        .back-link svg {
            width: 16px;
            height: 16px;
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            z-index: 1000;
            padding: 13px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            max-width: 90vw;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: rgba(34, 197, 94, 0.9);
            border: 1px solid rgba(34, 197, 94, 0.5);
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
        .toast svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px 32px;
                border-radius: 24px;
            }
            .login-logo h1 {
                font-size: 22px;
            }
            .social-buttons {
                flex-direction: column;
            }
            .logo-wrap {
                width: 84px;
                height: 84px;
            }
            .login-logo img {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>

    <!-- Background layers -->
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="container">
        <a href="index.html" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Home
        </a>

        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <div class="logo-wrap">
                    <img src="./hyna-logo-new.png" alt="Hyna Community Logo">
                </div>
                <div>
                    <h1><span>Hyna</span> Community</h1>
                    <p>Sign in to your account</p>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M22 7l-10 5L2 7"/>
                        </svg>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social login -->
            <div class="social-buttons">
                <button class="btn-social" type="button">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </button>
                <button class="btn-social" type="button">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    GitHub
                </button>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                Don't have an account? <a href="./signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast" id="toast"></div>

    <script type="module">
    import { supabase } from './supabase.js';

    // ---------- Toast helper ----------
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(message, type = 'success') {
        toast.className = 'toast ' + type;
        const icon = type === 'success'
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        toast.innerHTML = icon + '<span>' + message + '</span>';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ---------- Password toggle ----------
    const passwordInput = document.querySelector('#password');
    const toggleBtn = document.querySelector('#togglePassword');
    toggleBtn.addEventListener('click', () => {
        const isOpen = passwordInput.type === 'text';
        passwordInput.type = isOpen ? 'password' : 'text';
        toggleBtn.innerHTML = isOpen
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    });

    // ---------- Input focus animation ----------
    document.querySelectorAll('.input-wrap input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.style.transform = 'scale(1.01)';
        });
        input.addEventListener('blur', () => {
            input.parentElement.style.transform = 'scale(1)';
        });
    });

    // ---------- Mouse-follow glow ----------
    const cursorGlow = document.getElementById('cursorGlow');
    window.addEventListener('mousemove', (e) => {
        cursorGlow.style.left = e.clientX + 'px';
        cursorGlow.style.top = e.clientY + 'px';
    });

    // ---------- Login ----------
    const loginBtn = document.querySelector('#loginBtn');
    const loginForm = document.querySelector('#loginForm');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.querySelector('#email').value.trim();
        const password = document.querySelector('#password').value;

        if (!email || !password) {
            showToast('Please fill in all fields.', 'error');
            return;
        }

        // Loading state
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            loginBtn.classList.remove('loading');
            loginBtn.disabled = false;
            showToast('Login failed: ' + error.message, 'error');
        } else {
            showToast('Login successful! Welcome back!');
            console.log('User:', data.user);
            const user = data.user;
            const { error: profileError } = await supabase.from('profiles').upsert({
                id: user.id,
                email: user.email,
                last_login: new Date()
            });

            if (profileError) {
                console.error('Profile save error:', profileError);
            }

            // Redirect after success
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        }
    });
    </script>

</body>
</html>
